name: Refresh live data

on:
  schedule:
    - cron: "23 1 * * *"  # daily
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - assets/build.py
      - assets/fetch_stats.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same fonts + Pillow as local builds, so text measurement is identical.
      - name: Install build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter python3-pil

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F login='${{ github.repository_owner }}' -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > assets/activity.json

      - name: Fetch npm and GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 assets/fetch_stats.py

      - name: Render artwork
        run: /usr/bin/python3 assets/build.py

      - name: Commit
        run: |
          git add assets/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh live data"
          git push
