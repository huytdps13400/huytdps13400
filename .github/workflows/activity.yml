name: Refresh activity card

on:
  schedule:
    - cron: "23 1 * * *"  # daily
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - assets/build.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -F login='${{ github.repository_owner }}' -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount } }
                  }
                }
              }
            }' > assets/activity.json

      - name: Render activity card
        run: python3 assets/build.py activity

      - name: Commit
        run: |
          git add assets/activity.json assets/activity.svg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh activity card"
          git push
