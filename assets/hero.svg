  <text x="72" y="516" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5" >5+</text><text x="72" y="543" font-size="13" font-weight="700" fill="#6B819B" letter-spacing="1.3" >YEARS SHIPPING</text><line x1="244" y1="480" x2="244" y2="550" stroke="#1C3A5E" stroke-width="1.5"/><text x="272" y="516" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5" >4</text><text x="272" y="543" font-size="13" font-weight="700" fill="#6B819B" letter-spacing="1.3" >OPEN-SOURCE LIBS</text><line x1="444" y1="480" x2="444" y2="550" stroke="#1C3A5E" stroke-width="1.5"/><text x="472" y="516" font-size="38" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5" >3</text><text x="472" y="543" font-size="13" font-weight="700" fill="#6B819B" letter-spacing="1.3" >PAYMENT GATEWAYS</text>

