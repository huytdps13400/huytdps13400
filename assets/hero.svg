<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="612" viewBox="0 0 1200 612" role="img" aria-label="Trần Đình Huy — Senior React Native Engineer. I build secure, production-grade mobile apps and open-source the infrastructure behind them." fill="none">
<title>Trần Đình Huy — Senior React Native Engineer. I build secure, production-grade mobile apps and open-source the infrastructure behind them.</title>
<defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><filter id="shadow" x="-40%" y="-80%" width="180%" height="360%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000814" flood-opacity=".42"/></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity=".07"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .55"/></feComponentTransfer></filter><clipPath id="card"><rect x="18" y="0" width="1164" height="600" rx="28"/></clipPath><clipPath id="band"><polygon points="18,0 1182,0 1182,300 18,130"/></clipPath><clipPath id="screen"><rect x="830" y="36" width="252" height="528" rx="37"/></clipPath><clipPath id="btn"><rect x="854" y="476" width="204" height="50" rx="12"/></clipPath><clipPath id="ccard"><rect x="854" y="160" width="204" height="128" rx="14"/></clipPath><linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#C3BEFF"/><stop offset="1.00" stop-color="#80E9FF"/></linearGradient><linearGradient id="cc" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#635BFF"/><stop offset="0.50" stop-color="#8F6BFF"/><stop offset="1.00" stop-color="#00D4FF"/></linearGradient><linearGradient id="ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#3ECF8E"/><stop offset="1.00" stop-color="#00D4FF"/></linearGradient><linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#4A5878"/><stop offset="0.50" stop-color="#111A2C"/><stop offset="1.00" stop-color="#2B3753"/></linearGradient><linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#FFFFFF00"/><stop offset="0.50" stop-color="#FFFFFF66"/><stop offset="1.00" stop-color="#FFFFFF00"/></linearGradient><radialGradient id="pglow"><stop offset="0" stop-color="#635BFF" stop-opacity="0.55"/><stop offset="1" stop-color="#635BFF" stop-opacity="0"/></radialGradient><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.b1{animation:d1 19s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(110px,50px)}}
.b2{animation:d2 23s ease-in-out infinite alternate}@keyframes d2{to{transform:translate(-90px,60px)}}
.b3{animation:d3 17s ease-in-out infinite alternate}@keyframes d3{to{transform:translate(80px,-50px)}}
.b4{animation:d4 21s ease-in-out infinite alternate}@keyframes d4{to{transform:translate(-100px,-40px)}}

.float{animation:fl 6s ease-in-out infinite alternate}
.float2{animation:fl 7s 1.2s ease-in-out infinite alternate}
.float3{animation:fl 8s .6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-12px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-out infinite}
@keyframes pu{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
.shine{animation:sh 3.8s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-120px)}55%,100%{transform:translateX(320px)}}
</style></defs>

