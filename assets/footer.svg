<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Let's build something people trust. Open to senior React Native roles, consulting and open-source collaboration." fill="none">
<title>Let's build something people trust. Open to senior React Native roles, consulting and open-source collaboration.</title>
<defs><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity=".07"/></pattern><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .55"/></feComponentTransfer></filter><linearGradient id="eb" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#C3BEFF"/><stop offset="1.00" stop-color="#80E9FF"/></linearGradient><clipPath id="card"><rect x="18" width="1164" height="288" rx="28"/></clipPath><clipPath id="band2"><polygon points="18,168 1182,168 1182,30 18,130"/></clipPath><style>
